name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: app
    attributes:
      label: For which app are you filling this bug report?
      options:
        - nautobot-calendars
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: [e.g., Windows, macOS, Linux]
        - Browser: [e.g., Chrome, Firefox, Safari, Microsoft Edge]
        - Nautobot version: [e.g., 3.1.0]
        - App version: [e.g., 1.0.0]
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if applicable.
    validations:
      required: false
