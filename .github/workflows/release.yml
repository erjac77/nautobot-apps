---
name: Release
description: Create a new release

on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        description: Nautobot App to release
        required: true
        options:
          - calendars
      prerelease:
        type: choice
        description: Pre-release (alpha, beta or release candidate)
        required: true
        default: 'none'
        options:
          - none
          - alpha
          - beta
          - rc

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.NEW_VERSION }}
      changelog: ${{ steps.changelog.outputs.TOWNCRIER_NOTES }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Required by commitizen to parse the git history

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install

      - name: Configure Git author
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Determine new version
        id: version
        run: |
          cd packages/nautobot-${{ inputs.app }}
          NEW_VERSION=$(uvx --from commitizen cz bump --get-next --yes ${{ case(inputs.prerelease != 'none', format('--prerelease {0}', inputs.prerelease), '') }})
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          echo "TOWNCRIER_NOTES<<EOF" >> $GITHUB_OUTPUT
          uvx towncrier build --config pyproject.toml --dir docs/${{ inputs.app }} --version ${{ steps.version.outputs.NEW_VERSION }} --draft >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          uvx towncrier build --config pyproject.toml --dir docs/${{ inputs.app }} --version ${{ steps.version.outputs.NEW_VERSION }} --yes

      - name: Bump version
        run: |
          cd packages/nautobot-${{ inputs.app }}
          uvx --from commitizen cz bump --yes ${{ case(inputs.prerelease != 'none', format('--prerelease {0}', inputs.prerelease), '') }}

      - name: Push changes and tags
        run: git push origin main --follow-tags

      - name: Build package distributions
        run: uv build --package nautobot-${{ inputs.app }}

      - name: Upload distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-packages
          path: dist

  github-release:
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      contents: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-packages
          path: dist

      - name: Create GH release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body: ${{ needs.build.outputs.changelog }}
          tag_name: ${{ inputs.app }}@${{ needs.build.outputs.version }}
          prerelease: ${{ case(inputs.prerelease != 'none', true, false) }}
          working_directory: dist
          files: nautobot_*

  publish-to-testpypi:
    runs-on: ubuntu-latest
    needs: [build]

    environment:
      name: testpypi-nautobot-${{ inputs.app }}
      url: https://test.pypi.org/p/nautobot-${{ inputs.app }}

    permissions:
      id-token: write # OIDC for Trusted Publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-packages
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    runs-on: ubuntu-latest
    needs: [publish-to-testpypi]

    environment:
      name: pypi-nautobot-${{ inputs.app }}
      url: https://pypi.org/p/nautobot-${{ inputs.app }}

    permissions:
      id-token: write # OIDC for Trusted Publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-packages
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
