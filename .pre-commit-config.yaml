---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv lock
        stages: [post-checkout, post-merge, post-rewrite]
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false
        language: unsupported
      - id: commitizen
        name: commitizen check
        entry: uvx --from 'commitizen==4.18.0' cz check
        args: [--allow-abort, --commit-msg-file]
        stages: [commit-msg]
        language: unsupported
      - id: commitizen-branch
        name: commitizen check branch
        entry: uvx --from 'commitizen==4.18.0' cz check
        args: [--rev-range, "$PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF"]
        stages: [pre-push]
        pass_filenames: false
        language: unsupported
      - id: ruff-check
        name: ruff check
        entry: uvx ruff@0.16.5 check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: unsupported
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uvx ruff@0.16.5 format --force-exclude --exit-non-zero-on-format
        require_serial: true
        language: unsupported
        types: [python]
      - id: ty-check
        name: ty check
        entry: uvx ty@0.0.75 check
        require_serial: true
        pass_filenames: false
        language: unsupported
        types: [python]
