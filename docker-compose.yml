---
services:
  db:
    image: postgres:15
    container_name: db
    env_file:
      - .devcontainer/postgres.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 6s
      interval: 6s
      timeout: 5s
      retries: 4
  redis:
    image: redis:alpine
    container_name: redis
    expose:
      - 6379
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: dev
    user: vscode
    volumes:
      - .:/workspace:cached
    command: sleep infinity

volumes:
  pg_data:
