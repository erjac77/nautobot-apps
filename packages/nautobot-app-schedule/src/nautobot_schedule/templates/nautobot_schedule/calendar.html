{% load helpers %}

<!-- rrule lib -->
<script src="https://cdn.jsdelivr.net/npm/rrule@2.6.4/dist/es5/rrule.min.js"></script>

<!-- fullcalendar bundle -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>

<!-- the rrule-to-fullcalendar connector. must go AFTER the rrule lib -->
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@7.1.0/global.js"></script>

<!-- THEME JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/global.js"></script>

<!-- STYLESHEETS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/theme.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/palettes/purple.css" rel="stylesheet" />

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {
            headerToolbar: {
                start: 'prev,next today',
                center: 'title',
                right: 'dayGridYear,dayGridMonth,dayGridWeek,dayGridDay'
            },
            initialView: '{{ "initial_view" | settings_or_config:"nautobot_schedule" }}',
            editable: true,
            events: '{% url "plugins-api:nautobot_schedule-api:schedule-events" pk=object.id %}',
            eventClick: function (info) {
                var eventObj = info.event;
                var base_url = '{% url "plugins:nautobot_schedule:event_edit" pk=0 %}'
                var final_url = base_url.replace('/0/', '/' + eventObj.id + '/') + '?return_url=/plugins/schedule/schedules/{{ object.id }}/';
                window.location.href = final_url
            },
        });
        calendar.render();
    });
</script>

<div id='calendar'></div>
