<!-- rrule lib -->
<script src='https://cdn.jsdelivr.net/npm/rrule@2.6.4/dist/es5/rrule.min.js'></script>

<!-- fullcalendar bundle -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>

<!-- the rrule-to-fullcalendar connector. must go AFTER the rrule lib -->
<script src='https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@6.1.20/index.global.min.js'></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {
            headerToolbar: {
                start: 'prev,next today',
                center: 'title',
                right: 'dayGridYear,dayGridMonth,dayGridWeek,dayGridDay'
            },
            initialView: '{{ settings.PLUGINS_CONFIG.nautobot_calendars.initial_view }}',
            editable: true,
            events: '{% url "plugins-api:nautobot_calendars-api:calendar-events" pk=object.id %}',
            eventClick: function (info) {
                var eventObj = info.event;
                var base_url = '{% url "plugins:nautobot_calendars:event_edit" pk=0 %}'
                var final_url = base_url.replace('/0/', '/' + eventObj.id + '/') + '?return_url=/plugins/calendars/calendars/{{ object.id }}/';
                window.location.href = final_url
            },
        });
        calendar.render();
    });
</script>

<div id='calendar'></div>
